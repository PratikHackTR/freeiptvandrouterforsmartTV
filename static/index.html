<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHTV - Ana Sayfa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .logo {
            font-size: 4rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(to right, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .logo svg {
            width: 4.5rem;
            height: 4.5rem;
            fill: #38bdf8;
        }

        .subtitle {
            font-size: 1.5rem;
            color: #94a3b8;
            font-weight: 400;
        }

        .btn-container {
            display: flex;
            gap: 2.5rem;
            width: 100%;
            max-width: 900px;
            justify-content: center;
        }

        .tv-card {
            flex: 1;
            background: rgba(30, 41, 59, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .tv-card:focus, .tv-card:hover {
            transform: translateY(-10px) scale(1.03);
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.15);
            box-shadow: 0 20px 40px rgba(56, 189, 248, 0.3);
        }

        .tv-card.redirect-btn:focus, .tv-card.redirect-btn:hover {
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.15);
            box-shadow: 0 20px 40px rgba(244, 63, 94, 0.3);
        }

        .icon-box {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
        }

        .tv-card:focus .icon-box, .tv-card:hover .icon-box {
            background: #38bdf8;
            color: #0f172a;
        }

        .tv-card.redirect-btn:focus .icon-box, .tv-card.redirect-btn:hover .icon-box {
            background: #f43f5e;
            color: #ffffff;
        }

        .icon-box svg {
            width: 48px;
            height: 48px;
            fill: currentColor;
        }

        .card-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .card-desc {
            font-size: 1.1rem;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }

        .footer-info {
            margin-top: 4rem;
            font-size: 1.1rem;
            color: #64748b;
            background: rgba(15, 23, 42, 0.6);
            padding: 0.75rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-info span {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            PHTV Media Center
        </div>
        <div class="subtitle">Lütfen izlemek istediğiniz seçeneği seçin</div>
    </div>

    <div class="btn-container">
        <!-- Canlı TV Button -->
        <a href="/tv" class="tv-card" id="btn-tv" tabindex="1">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="card-title">Canlı TV</div>
            <div class="card-desc">tüm ulusal kanalları kesintisiz izleyin</div>
        </a>

        <!-- Yönlendir Button -->
        <a href="/redirect" class="tv-card redirect-btn" id="btn-redirect" tabindex="2">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </div>
            <div class="card-title">Yönlendir</div>
            <div class="card-desc" id="redirect-url-preview">hedef.txt içerisindeki siteye doğrudan git</div>
        </a>
    </div>

    <div class="footer-info">
        TV Tarayıcısı Erişim Adresi: <span id="ip-address">http://localhost:9901</span>
    </div>

    <script>
        // Auto Focus first button for TV remote navigation
        window.addEventListener('DOMContentLoaded', () => {
            const btnTv = document.getElementById('btn-tv');
            if (btnTv) btnTv.focus();

            // Fetch IP & hedef URL info
            fetch('/api/info')
                .then(res => res.json())
                .then(data => {
                    if (data.target_url) {
                        document.getElementById('redirect-url-preview').textContent = 'Doğrudan git: ' + data.target_url;
                    }
                    if (data.local_ip) {
                        document.getElementById('ip-address').textContent = `http://${data.local_ip}:9901`;
                    }
                })
                .catch(err => console.log(err));
        });

        // Remote Controller Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            const focusable = Array.from(document.querySelectorAll('.tv-card'));
            const index = focusable.indexOf(document.activeElement);

            if (e.key === 'ArrowRight' && index < focusable.length - 1) {
                focusable[index + 1].focus();
            } else if (e.key === 'ArrowLeft' && index > 0) {
                focusable[index - 1].focus();
            } else if (e.key === 'Enter') {
                if (document.activeElement && document.activeElement.click) {
                    document.activeElement.click();
                }
            }
        });
    </script>
</body>
</html>

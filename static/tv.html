<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHTV - Canlı TV</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Player Area */
        .player-container {
            position: relative;
            flex: 1;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        /* Video Controls Overlay */
        .player-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,0.9) 100%);
            opacity: 1;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .player-overlay.hidden {
            opacity: 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .current-channel-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .current-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255,255,255,0.1);
        }

        .current-details h2 {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .current-details p {
            font-size: 0.9rem;
            color: #38bdf8;
        }

        .top-controls {
            display: flex;
            gap: 1rem;
        }

        .btn-action {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
            outline: none;
            backdrop-filter: blur(10px);
            text-decoration: none;
            font-size: 1rem;
        }

        .btn-action:focus, .btn-action:hover {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: scale(1.05);
        }

        .btn-action svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Sidebar Channel List */
        .sidebar {
            width: 380px;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .sidebar.collapsed {
            transform: translateX(100%);
            position: absolute;
            right: 0;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f8fafc;
        }

        .channel-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            outline: none;
            color: #cbd5e1;
        }

        .channel-item:focus, .channel-item:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
            color: #fff;
            transform: translateX(-4px);
        }

        .channel-item.active {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38bdf8;
            color: #fff;
        }

        .channel-item.featured {
            border: 1.5px solid #f43f5e;
            background: rgba(244, 63, 94, 0.1);
        }

        .channel-item.featured:focus, .channel-item.featured:hover {
            background: rgba(244, 63, 94, 0.3);
            border-color: #f43f5e;
        }

        .channel-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            padding: 4px;
        }

        .channel-name {
            font-weight: 600;
            font-size: 1.1rem;
            flex: 1;
        }

        .channel-badge {
            font-size: 0.75rem;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            color: #94a3b8;
        }

        .channel-item.featured .channel-badge {
            background: #f43f5e;
            color: #fff;
            font-weight: 700;
        }

        /* Status Toast */
        .toast {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            display: none;
            backdrop-filter: blur(10px);
            z-index: 200;
        }
    </style>
</head>
<body>

    <!-- Video Player -->
    <div class="player-container" id="player-container">
        <video id="video-player" autoplay controls crossorigin="anonymous"></video>
        
        <div class="player-overlay" id="player-overlay">
            <div class="top-bar">
                <div class="current-channel-info" id="channel-info-box">
                    <img src="" id="current-logo" class="current-logo" alt="Logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'48\' height=\'48\' viewBox=\'0 0 24 24\' fill=\'%2338bdf8\'><path d=\'M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z\'/></svg>'">
                    <div class="current-details">
                        <h2 id="current-title">Kanal Yükleniyor...</h2>
                        <p id="current-cat">Canlı TV</p>
                    </div>
                </div>

                <div class="top-controls">
                    <button class="btn-action" id="btn-toggle-sidebar" tabindex="10">
                        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        Kanal Listesi
                    </button>

                    <button class="btn-action" id="btn-fullscreen" tabindex="11">
                        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
                        Tam Ekran
                    </button>

                    <a href="/" class="btn-action" id="btn-home" tabindex="12">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        Ana Sayfa
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar List -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Kanal Listesi</h3>
            <span class="channel-badge" id="total-channels-count">0 Kanal</span>
        </div>
        <div class="channel-list" id="channel-list">
            <!-- Dynamic Channels -->
        </div>
    </div>

    <div class="toast" id="toast">Kanal Yükleniyor...</div>

    <script>
        let hls = null;
        let channelsData = [];
        let activeChannelIndex = 0;
        let overlayTimeout = null;

        const video = document.getElementById('video-player');
        const sidebar = document.getElementById('sidebar');
        const channelListEl = document.getElementById('channel-list');
        const overlay = document.getElementById('player-overlay');
        const toast = document.getElementById('toast');

        // Fetch channels from server
        window.addEventListener('DOMContentLoaded', () => {
            fetch('/api/channels')
                .then(res => res.json())
                .then(data => {
                    channelsData = data;
                    document.getElementById('total-channels-count').textContent = `${data.length} Kanal`;
                    renderChannelsList();

                    // Play default channel (TV100 if available, else first channel)
                    const tv100Index = channelsData.findIndex(c => c.id === 'tv100');
                    playChannel(tv100Index !== -1 ? tv100Index : 0);
                })
                .catch(err => {
                    showToast('Kanal listesi alınamadı!');
                    console.error(err);
                });
        });

        function renderChannelsList() {
            channelListEl.innerHTML = '';
            channelsData.forEach((ch, idx) => {
                const item = document.createElement('div');
                item.className = `channel-item ${ch.isFeatured ? 'featured' : ''} ${idx === activeChannelIndex ? 'active' : ''}`;
                item.tabIndex = idx + 1;
                item.dataset.index = idx;

                const fallbackIcon = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24' fill='%2338bdf8'><path d='M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z'/></svg>";

                item.innerHTML = `
                    <img src="${ch.logo}" class="channel-logo" alt="${ch.name}" onerror="this.src='${fallbackIcon}'">
                    <span class="channel-name">${ch.name}</span>
                    <span class="channel-badge">${ch.isFeatured ? 'ÖNE ÇIKAN' : ch.category}</span>
                `;

                item.addEventListener('click', () => playChannel(idx));
                channelListEl.appendChild(item);
            });

            // Focus active item or first item
            const firstItem = channelListEl.querySelector('.channel-item');
            if (firstItem) firstItem.focus();
        }

        function playChannel(index) {
            if (index < 0 || index >= channelsData.length) return;
            activeChannelIndex = index;
            const channel = channelsData[index];

            // Update UI elements
            document.getElementById('current-title').textContent = channel.name;
            document.getElementById('current-cat').textContent = channel.category + (channel.isFeatured ? ' • Özel Yayın' : '');
            if (channel.logo) {
                document.getElementById('current-logo').src = channel.logo;
            }

            // Update Active class in sidebar
            const items = channelListEl.querySelectorAll('.channel-item');
            items.forEach((it, i) => {
                it.classList.toggle('active', i === index);
            });

            showToast(`${channel.name} Açılıyor...`);

            loadStream(channel.url, channel.backupUrl);
            resetOverlayTimer();
        }

        function loadStream(url, backupUrl) {
            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log('Autoplay error:', e));
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        console.warn('HLS Fatal Error, trying backup if available', data);
                        if (backupUrl && url !== backupUrl) {
                            showToast('Yedek yayına geçiliyor...');
                            loadStream(backupUrl, null);
                        } else {
                            showToast('Yayın yüklenemedi. Farklı bir kanal deneyin.');
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native Safari / Smart TV HLS
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log(e));
                });
            } else {
                showToast('Tarayıcınız HLS yayınlarını desteklemiyor.');
            }
        }

        // Fullscreen Toggle
        document.getElementById('btn-fullscreen').addEventListener('click', () => {
            const container = document.getElementById('player-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) container.requestFullscreen();
                else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
                else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        // Sidebar Toggle
        const toggleBtn = document.getElementById('btn-toggle-sidebar');
        toggleBtn.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            if (!sidebar.classList.contains('collapsed')) {
                const activeEl = channelListEl.querySelector('.channel-item.active') || channelListEl.querySelector('.channel-item');
                if (activeEl) activeEl.focus();
            }
        });

        function showToast(msg) {
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        function resetOverlayTimer() {
            overlay.classList.remove('hidden');
            clearTimeout(overlayTimeout);
            overlayTimeout = setTimeout(() => {
                if (document.activeElement && document.activeElement.closest('.top-controls')) return;
                overlay.classList.add('hidden');
            }, 5000);
        }

        // Keyboard & TV Remote Navigation
        document.addEventListener('mousemove', resetOverlayTimer);
        document.addEventListener('keydown', (e) => {
            resetOverlayTimer();

            // Return/Back Key (Escape or Backspace)
            if (e.key === 'Escape' || e.key === 'Backspace') {
                if (!sidebar.classList.contains('collapsed')) {
                    sidebar.classList.add('collapsed');
                } else {
                    window.location.href = '/';
                }
                return;
            }

            const current = document.activeElement;
            const items = Array.from(channelListEl.querySelectorAll('.channel-item'));
            const currentIndex = items.indexOf(current);

            if (e.key === 'ArrowDown') {
                if (currentIndex !== -1 && currentIndex < items.length - 1) {
                    items[currentIndex + 1].focus();
                } else if (currentIndex === -1) {
                    if (items[0]) items[0].focus();
                }
            } else if (e.key === 'ArrowUp') {
                if (currentIndex > 0) {
                    items[currentIndex - 1].focus();
                }
            } else if (e.key === 'ArrowRight') {
                if (!sidebar.classList.contains('collapsed')) {
                    sidebar.classList.add('collapsed');
                }
            } else if (e.key === 'ArrowLeft') {
                if (sidebar.classList.contains('collapsed')) {
                    sidebar.classList.remove('collapsed');
                    const activeItem = items[activeChannelIndex] || items[0];
                    if (activeItem) activeItem.focus();
                }
            } else if (e.key === 'Enter') {
                if (currentIndex !== -1) {
                    playChannel(currentIndex);
                }
            }
        });
    </script>
</body>
</html>
